system: "base16"
name: "Ghaf Dark"
author: "TII (SSRC) and the Ghaf contributors"
variant: "dark"
palette:
  base00: "#1c1c1c" # Default Background
  base01: "#242424" # Lighter Background (Used for status bars, line number and folding marks)
  base02: "#2e2e2e" # Selection Background
  base03: "#767676" # Comments, Invisibles, Line Highlighting
  base04: "#9a9a9a" # Dark Foreground (Used for status bars)
  base05: "#d0d0d0" # Default Foreground, Caret, Delimiters, Operators (text)
  base06: "#e4e4e4" # Light Foreground (Not often used)
  base07: "#f2f4fd" # Light Background (Not often used)
  base08: "#F4535A" # Variables, XML Tags, Markup Link Text, Markup Lists, Diff Deleted
  base09: "#F1784E" # Integers, Boolean, Constants, XML Attributes, Markup Link Url
  base0A: "#FABC3C" # Classes, Markup Bold, Search Text Background
  base0B: "#5AC379" # Strings, Inherited Class, Markup Code, Diff Inserted
  base0C: "#25E2F4" # Support, Regular Expressions, Escape Characters, Markup Quotes
  base0D: "#5B8CF7" # Functions, Methods, Attribute IDs, Headings
  base0E: "#B368F8" # Keywords, Storage, Selector, Markup Italic, Diff Changed
  base0F: "#A6683A" # Deprecated, Opening/Closing Embedded Language Tags, e.g. <?php ?>
