#
# Ghaf Hardware Test Automation - Configuration
#
# Two names, and they are not the same name
# ------------------------------------------
# `ghaf_target`      what you BUILD and FLASH. x86 laptops now share the generic
#                    `intel-laptop-*` image: modules/reference/hardware/intel-laptop/
#                    passes display, network and audio through by PCI *class wildcard*
#                    rather than per-device IDs, so one image covers the fleet. There are no
#                    per-machine Intel laptop targets any more; only AMD boards and desktops
#                    (lenovo-t14-amd-gen5, alienware-m18-R2, demo-tower-mk1, tower-5080)
#                    keep their own.
#
# `test_device_name` what you pass to `robot-test -d`. The Robot suite still selects
#                    behaviour per physical machine and accepts only the fixed set
#                    below (see nix/devshell.nix). It has no `intel-laptop` value.
#
# Keying this file by physical machine keeps both straight: the generic image goes on
# any of them, but the test run still has to say which machine it is talking to.

# Where the machine-specific values live
# --------------------------------------
# This file is shared, so it holds only what is true for the *project*: which
# image a device takes, which name the Robot suite expects, how it is flashed.
#
# Anything that describes whoever's desk the hardware is sitting on -- addresses,
# MAC addresses, ssh identities, drive and serial nodes -- goes in
# `config.local.yaml` next to this file, which is gitignored. Those fields are
# left `null` here. See `config.local.yaml.example` for the shape, and override
# the path with GHAF_HW_TEST_LOCAL_CONFIG if you keep it elsewhere.
#
# Merge rule: local wins per field; a `null` in the local file does not blank a
# value set here.

# Device profiles
# Each device has defaults that can be overridden via CLI
devices:
  darter-pro:
    architecture: x86_64
    # Generic laptop image
    ghaf_target: intel-laptop-debug
    test_device_name: darter-pro
    default_threads: 16
    default_tag: pre-merge
    flash_method: ghaf-flash
    connection: ssh
    boot_wait_seconds: 180
    # Connection details for the ghaf-* skills in .claude/skills/. Fill these in for
    # the machine on your desk; leave null for devices you reach some other way.
    host_ip: null # ghaf-host address, e.g. 192.168.1.50
    usb_iface: ghaf-usb # host-side NIC facing the device
    flash_drive: null # e.g. /dev/sda -- verified before any write
    serial_device: null # e.g. /dev/ttyUSB0, when a serial cable is attached
    serial_baud: 115200

  Lenovo-X1:
    architecture: x86_64
    # Generic laptop image
    ghaf_target: intel-laptop-debug
    test_device_name: lenovo-x1
    default_threads: 20
    default_tag: pre-merge
    flash_method: ghaf-flash
    connection: ssh
    boot_wait_seconds: 180
    host_ip: null # set in config.local.yaml
    usb_iface: ghaf-usb
    ssh_identity: null # set in config.local.yaml if not an ssh default
    flash_drive: null
    serial_device: null
    serial_baud: 115200
    # Netboot. Verified end to end on this machine 2026-08-01: PXE -> iPXE ->
    # kernel+initrd over HTTP -> installer -> image written to NVMe -> boots.
    #
    # netboot_iface is the BUILD HOST's NIC facing the target -- deliberately
    # NOT usb_iface, which is already overloaded as both an interface name and
    # an ssh alias. It is the interface you would run tcpdump on.
    netboot_iface: null # set in config.local.yaml -- the BUILD HOST's NIC
    # The TARGET's PXE NIC. The X1 Carbon has no built-in RJ45, and a generic
    # ASIX USB-C dongle never emits a PXE request at all -- the firmware has no
    # UEFI driver for it. A Lenovo USB-C dock does work, so this is the DOCK's
    # MAC, which differs from the MAC the OS shows on its usual link.
    netboot_mac: null # set in config.local.yaml -- the TARGET's PXE NIC
    boot_menu_key: F12
    # An install needs far longer than a boot: PXE, initrd, then several GB
    # fetched over HTTP and written to NVMe. boot_wait_seconds (a boot budget)
    # is not a substitute -- using it here reports failure mid-write.
    netboot_install_wait_seconds: 1800
    # The netboot chain is unsigned, exactly as the installer ISO is.
    secureboot_must_be_off: true

  dell-7330:
    architecture: x86_64
    # Generic laptop image, low-mem variant. This is a 16 GiB machine
    # (15.7 GiB usable), so the plain intel-laptop-debug over-allocates here:
    # flatpak-vm 18432 MB against the 15360 MB the low-mem axis sets, on a host
    # that already sits near zero available. Verified on hardware 2026-08-02.
    ghaf_target: intel-laptop-low-mem-debug
    test_device_name: dell-7330
    default_threads: 12
    default_tag: pre-merge
    flash_method: ghaf-flash
    connection: ssh
    boot_wait_seconds: 180
    host_ip: null
    usb_iface: ghaf-usb
    flash_drive: null
    serial_device: null
    serial_baud: 115200
    # Netboot. Verified end to end on this machine 2026-08-02: PXE -> iPXE ->
    # kernel+initrd over HTTP -> unattended install to /dev/nvme0n1 -> boots.
    #
    # netboot_iface is the BUILD HOST's NIC facing the target -- deliberately
    # NOT usb_iface, which is already overloaded as both an interface name and
    # an ssh alias. It is the interface you would run tcpdump on.
    netboot_iface: null # set in config.local.yaml -- the BUILD HOST's NIC
    # The TARGET's PXE NIC. Unlike the X1 this is the BUILT-IN I219-LM
    # (8086:15fb) at 00:1f.6, so there is no dock or dongle in the path.
    netboot_mac: null # set in config.local.yaml -- the TARGET's PXE NIC
    boot_menu_key: F12
    # This firmware publishes THREE network boot entries, all on the same MAC:
    #   Boot0000* ONBOARD NIC (IPV4)   <- the PXE entry. This is the one to use.
    #   Boot0001  ONBOARD NIC (IPV6)
    #   Boot0002  UEFI HTTPs Boot ...Uri()
    # Boot the IPV4 one. UEFI HTTP Boot does NOT work: it announces DHCP option
    # 93 arch 16, and pixiecore handles only arch 0/6/7/9, so it discards the
    # packet and the boot API is never consulted. Observed as
    # "unsupported client firmware type '16'" and nothing else.
    #
    # Note netboot_preflight matches MAC\(|PXE|Network|IPv4 and takes the first
    # hit -- all three entries above match, and it lands on the right one only
    # because Boot0000 sorts first. Check the bootnum before trusting BootNext.
    #
    # Unlike the X1, NVMe is FIRST in BootOrder here (0003,0000,0002,0001), so
    # this machine does not netboot on every reboot: BootNext is required for a
    # hands-off run, and a lingering server cannot cause an install loop.
    netboot_install_wait_seconds: 1800
    # The netboot chain is unsigned, exactly as the installer ISO is.
    secureboot_must_be_off: true

  # Jetsons are cross-built from x86_64. The native aarch64 attribute names are NOT
  # exposed in packages.x86_64-linux, so a build host has to name the `-from-x86_64`
  # variants -- the previous values here silently resolved to nothing.
  Orin-AGX:
    architecture: aarch64
    ghaf_target: nvidia-jetson-orin-agx-debug-from-x86_64
    test_device_name: orin-agx
    default_threads: 12
    default_tag: pre-merge
    flash_method: flash-script
    flash_script_target: nvidia-jetson-orin-agx-debug-from-x86_64-flash-script
    connection: ssh
    boot_wait_seconds: 240
    host_ip: null # set in config.local.yaml
    usb_iface: ghaf-usb
    flash_drive: null
    # The AGX devkit exposes its console over the USB-C debug port as a composite
    # device presenting /dev/ttyACM0-3, NOT /dev/ttyUSB0 -- there is no ttyUSB
    # node at all, so the previous value made serial-console.sh fail on a path
    # that cannot exist. ACM0 is the one carrying the ghaf-host console.
    serial_device: /dev/ttyACM0
    serial_baud: 115200

  Orin-NX:
    architecture: aarch64
    ghaf_target: nvidia-jetson-orin-nx-debug-from-x86_64
    test_device_name: orin-nx
    default_threads: 8
    default_tag: pre-merge
    flash_method: flash-script
    flash_script_target: nvidia-jetson-orin-nx-debug-from-x86_64-flash-script
    connection: ssh
    boot_wait_seconds: 240
    host_ip: null
    usb_iface: ghaf-usb
    flash_drive: null
    # UNVERIFIED. The AGX turned out to enumerate as /dev/ttyACM* rather than
    # ttyUSB*; whether the NX carrier does the same has not been checked on
    # hardware, so this is left as-is. Confirm with `ls /dev/ttyACM* /dev/ttyUSB*`
    # while the NX is attached before trusting it.
    serial_device: /dev/ttyUSB0
    serial_baud: 115200

# Test execution settings
test:
  default_password: ghaf
  results_dir: /tmp/test_results
  default_tag: pre-merge
  timeout_minutes: 60

# Fix loop settings
fix_loop:
  max_iterations: 5
  pause_for_fixes: true
  auto_commit: false
  # Touch this path to stop an unattended loop before its next destructive step.
  stop_file: /tmp/ghaf-loop-stop

# Analysis settings
analysis:
  output_format: markdown
  include_stack_traces: true
  map_to_ghaf_modules: true

# Failure pattern mappings
# Maps test failures to likely Ghaf module locations
failure_patterns:
  ssh_connection:
    patterns:
      - "SSHException"
      - "Connection refused"
      - "Connection timed out"
    likely_modules:
      - modules/common/networking/
      - modules/common/security/
    suggestion: "Check network configuration and firewall rules"

  service_not_running:
    patterns:
      - "service .* not found"
      - "Unit .* not found"
      - "systemctl.*failed"
    likely_modules:
      - modules/common/services/
      - modules/microvm/
    suggestion: "Verify systemd service configuration"

  gui_failure:
    patterns:
      - "GUI element not found"
      - "Screen capture failed"
      - "Weston.*error"
    likely_modules:
      - modules/desktop/
      - modules/hardware/graphics/
    suggestion: "Check desktop and graphics configuration"

  missing_test_config:
    patterns:
      - "Variable '\\$\\{STATIC_DEVICE_ID\\}' not found"
      - "Variable '\\$\\{STATIC_NETVM_NAME\\}' not found"
      - "Variable '\\$\\{SERIAL_PORT\\}' not found"
    likely_modules:
      - .claude/skills/ghaf-test/SKILL.md
    suggestion:
      "Not a device fault -- no test_config.json was passed. robot-test needs
      --config <dir> holding test_config.json with this rig's serial_port, device_ip_address,
      threads, relay_serial_port (all mandatory) plus device_id and netvm_hostname. The
      variables are left unset rather than defaulted, so they surface as 'Variable not
      found' at use rather than at load. All three failing together is the tell. See the
      ghaf-test skill for how to derive the values from the device."

  test_user_missing:
    patterns:
      - "User not created"
      - "does not contain 'testuser'"
      - "Authentication failed for user 'testuser'"
      - "No active session found for testuser"
    likely_modules:
      - modules/common/services/user-provision.nix
      - modules/common/users/homed.nix
    suggestion:
      "Environmental, not a regression -- the whole suite fails in setup when
      testuser is missing. user-provision-test.service is skipped by its exec-condition on
      any device that already has a login user, and systemd reports a condition-skipped
      unit as a successful start. Ghaf is single-user by construction (storagevm sizes
      /home for one home area, and uid 1000 is baked into GIVC and memsocket paths), so
      testuser cannot coexist with a real account. Either flash a fresh debug image, or run
      ghaf-test-user-reset on the device -- it prompts, and destroys the existing home
      irrecoverably."

  login_failure:
    patterns:
      - "pam_setcred"
      - "greetd.*authentication error"
      - "Failed to start Greeter"
    likely_modules:
      - modules/desktop/graphics/login-manager.nix
      - modules/common/services/
    suggestion: "Check the greetd/login PAM stacks; render them with
      security.pam.services.<name>.text before guessing"

  vm_communication:
    patterns:
      - "GIVC.*error"
      - "inter-vm.*failed"
      - "microvm.*unreachable"
    likely_modules:
      - modules/givc/
      - modules/microvm/
    suggestion: "Check GIVC and microvm configuration"

  boot_failure:
    patterns:
      - "Boot timeout"
      - "Kernel panic"
      - "Failed to start"
    likely_modules:
      - modules/hardware/
      - modules/common/boot/
    suggestion: "Check hardware and boot configuration"

  performance:
    patterns:
      - "Performance below threshold"
      - "Timeout exceeded"
      - "Too slow"
    likely_modules:
      - modules/hardware/
      - modules/common/performance/
    suggestion: "Check hardware settings and performance tuning"

# Logging
logging:
  level: INFO
  file: /tmp/ghaf-hw-test.log
