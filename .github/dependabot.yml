version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      ignore:
          # Issuer updates require coordinating Jenkins's trustedWorkflowSha.
          - dependency-name: tiiuae/ghaf-infra/.github/workflows/issue-source-vsa.yml
      groups:
          # Keep CodeQL actions together so analyze accepts init's config.
          github-actions:
              patterns:
                  - "*"

    - package-ecosystem: npm
      directory: /docs
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
