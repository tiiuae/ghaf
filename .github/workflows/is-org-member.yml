name: Check organization membership

permissions: {}

on:
  workflow_call:
    secrets:
      read-org-members:
        description: "Github token with read access to organization members"
        required: true
    inputs:
      github-org:
        description: "Github organization name"
        required: true
        type: string
      github-user:
        description: "Github user name"
        required: true
        type: string
    outputs:
      is_org_member:
        description: "Whether the user is an organization member"
        value: ${{ jobs.check.outputs.is_org_member }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is_org_member: ${{ steps.check-is-org-member.outputs.is_org_member }}
    environment: "internal"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check identity
        id: check-is-org-member
        shell: bash
        # More details: https://docs.github.com/en/rest/orgs/members
        run: |
          user_enc=$(printf '%s' "${GITHUB_USER}" | jq -sRr '@uri')
          org_enc=$(printf '%s' "${GITHUB_ORG}" | jq -sRr '@uri')
          response=$(curl -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${READ_ORG_MEMBERS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${org_enc}/members/${user_enc}")
          case "$response" in
            204) is_org_member='True' ;;
            404) is_org_member='False' ;;
            *)
              echo "::warning::Organization membership check returned HTTP $response"
              is_org_member='False'
              ;;
          esac
          echo "is_org_member=$is_org_member" >>"$GITHUB_OUTPUT"
        env:
          GITHUB_ORG: ${{ inputs.github-org }}
          GITHUB_USER: ${{ inputs.github-user }}
          READ_ORG_MEMBERS_TOKEN: ${{ secrets.read-org-members }}
