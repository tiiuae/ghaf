name: check
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
permissions:
    contents: read

jobs:
    run-checks:
        runs-on: ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install nix
              uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
            - name: Check nix flake show runs successfully
              run: nix flake show --all-systems --accept-flake-config
            - name: Check FSS verification policy and clock-jump predicates
              # Sub-second, no remote builder. Here rather than build.yml so it
              # also covers pull requests from forks.
              run: nix build .#checks.x86_64-linux.fss-classifier-unit --accept-flake-config -L
