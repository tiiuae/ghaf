name: Auto-assign PR author

on:
  # pull_request_target so PRs from forks get a token that can assign; no PR code is checked out.
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  is-org-member:
    if: github.repository == 'tiiuae/ghaf'
    uses: ./.github/workflows/is-org-member.yml
    with:
      github-org: tiiuae
      github-user: ${{ github.event.pull_request.user.login }}
    secrets:
      read-org-members: ${{ secrets.READ_ORG_MEMBERS }}
  auto-assign-pr:
    needs: [is-org-member]
    # Unassigned external PRs stand out.
    if: needs.is-org-member.outputs.is_org_member == 'True'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
        with:
          abortIfPreviousAssignees: true
          assignees: ${{ github.event.pull_request.user.login }}
