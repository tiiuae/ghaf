name: Source VSA

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  source-vsa:
    name: Issue Source VSA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: source-vsa-${{ github.repository }}-${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Issue Source VSA
        uses: tiiuae/ghaf-infra/.github/actions/source-vsa@a8590c3b596071e1d3a94a430d30a89dfad70157
        with:
          policy: slsa/source-vsa-policy.yaml
          verified-level: SLSA_SOURCE_LEVEL_1
