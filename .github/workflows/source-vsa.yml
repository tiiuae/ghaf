name: Source VSA

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  source-vsa:
    name: Issue Source VSA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: source-vsa-${{ github.repository }}-${{ github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Issue Source VSA
        uses: tiiuae/ghaf-infra/.github/actions/source-vsa@3fdc1525f76a9a2bfdd954ea2b76bec637920593
        with:
          policy: slsa/source-vsa-policy.yaml
          verified-level: SLSA_SOURCE_LEVEL_1
