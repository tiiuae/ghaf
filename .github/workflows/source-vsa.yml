name: Source VSA

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  source-vsa:
    name: Issue Source VSA
    uses: tiiuae/ghaf-infra/.github/workflows/issue-source-vsa.yml@660e93c77e9840cf36278aef81ec39ec8a1ad7b2
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      source-ref: refs/heads/main
